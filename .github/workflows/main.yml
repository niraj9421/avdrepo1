# pipeline name / workflow name
name: first workflow

# set trigger event
on:
  push:
    branches:
      - main

# jobs:
#   print-message:
#     runs-on: ubuntu-latest
#     steps:
#       # step1
#       - name: print message
#         run: echo "Welcome to github actions"

#       # step2
#       - name: print message 2
#         run: echo "This is my first workflow"

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: step1
        run: echo "This is step 1"

  job2:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: step2
        run: echo "This is step 2"

  job3:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: step3
        run: echo "This is step 3"

  job4:
    needs: job2
    runs-on: ubuntu-latest
    steps:
      - name: step4
        run: echo "This is step 4"

  job5:
    needs: job3
    runs-on: ubuntu-latest
    steps:
      - name: step5
        run: echo "This is step 5"

  job6:
    needs:
      - job4
      - job5
    runs-on: ubuntu-latest
    steps:
      - name: step6
        run: echo "This is step 6"
